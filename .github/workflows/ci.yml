name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    strategy:
      matrix:
        node: ["22", "24", "26"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:ci

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
      - run: node scripts/run-examples.mjs

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - run: npm ci
      - run: npm audit --omit=dev
      - name: Build pinned secret scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - name: Scan shipping directory for secrets
        run: '"$(go env GOPATH)/bin/gitleaks" dir . --no-banner --redact'
      - name: Scan repository history for secrets
        run: '"$(go env GOPATH)/bin/gitleaks" git . --log-opts="--all" --no-banner --redact'

  renderers:
    name: Renderer and browser artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -r scripts/renderer-requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Require actual renderer and browser prerequisites
        run: |
          python - <<'PY'
          import markdown, pypdf
          from playwright.sync_api import sync_playwright
          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              browser.close()
          PY
      - name: Verify actual PDFs, PNGs and prototype interactions
        run: PB_RENDERER_PYTHON="$(command -v python)" node --test renderer-runtime.test.mjs
